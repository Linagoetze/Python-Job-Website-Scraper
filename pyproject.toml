[project]
name = "job-scraper"
version = "0.1.0"
description = "Scrapes configured career pages and filters postings against local rules."
requires-python = ">=3.10"
# Dependencies live in requirements.txt so there is one source of truth.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# target-version is deliberately not set: ruff infers it from requires-python
# above, so the `UP` rules can never rewrite code into syntax newer than the
# floor this project claims to support.

[tool.ruff.lint]
# E/W/F are the pyflakes-and-pycodestyle baseline, I keeps imports ordered, UP
# catches syntax left behind by older Python, B catches the bug-shaped ones
# (mutable defaults, loop-variable capture). Deliberately not enabled: rules
# that argue about design rather than mechanics — this project's structure is
# the refactor plan's business, not the linter's.
select = ["E", "F", "W", "I", "UP", "B"]

# No per-file-ignores. The only E402 suppression is inline, in
# tests/fixture_cases.py — and only there, though three modules amend sys.path
# to import from outside the package. Ruff exempts an import that follows a
# `sys.path` call directly, so scripts/capture_fixtures.py and
# scripts/migrate_curated_to_yaml.py need nothing. fixture_cases.py assigns
# `_PROJECT_ROOT` before its `sys.path.insert`, and an ordinary statement ends
# the exemption. Checked with `ruff check --extend-select RUF100 .` (SP1): an
# E402 `noqa` that suppresses nothing is reported, so add one only where ruff
# asks for it.
